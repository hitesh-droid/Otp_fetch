<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email OTP Fetcher</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #333;
            text-align: center;
            padding: 20px;
        }

        /* Back Button */
        .back-button {
            display: flex;
            width: 20%;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 40px;
            color: white;
            transition: 0.3s;
            margin-right: 1px;
            justify-content: center;
        }

        .back-button:hover {
            color: grey;
        }

        .header {

            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .header h2 {
            display: flex;
            justify-content: space-around;
            color: #fff;
            margin: 0;
        }

        /* Form Container */
        .container {
            max-width: 400px;
            background: #fff;
            padding: 20px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Input Field */
        input[type="email"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        /* Suggestion Box */
        #suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }

        .suggestion-item:hover {
            background: #f0f0f0;
        }

        /* Submit Button */
        button {
            width: 100%;
            background: #4facfe;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00c6fb;
        }

        /* OTP Result */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            font-size: 18px;
            text-align: left;
        }

        .result-box p {
            margin: 5px 0;
        }

        .result-box span {
            font-weight: bold;
            color: #4facfe;
        }

        /* Loader Animation */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="header">
        <button class="back-button" onclick="window.location.href='/dashboard'">&#8592;</button>
        <h2>🔑 Email OTP Fetcher</h2>
    </div>

    <div class="container">
        <form id="otpForm" autocomplete="off">
            <label for="emailInput">Enter Email:</label>

            <!-- Container to wrap input and suggestions -->
            <div style="position: relative;">
                <input type="email" id="emailInput" name="emailInput" placeholder="Enter your email..." required autocomplete="off">

                <!-- Suggestions -->
                <div id="suggestions"></div>
            </div>

            <button type="submit">Fetch OTP</button>
        </form>

        <div class="result-box">
            <p>📅 Date: <span id="otpDate">---</span></p>
            <p>⏰ Time: <span id="otpTime">---</span></p>
            <p>🔢 OTP: <span id="otpResult">---</span></p>
            <div id="loadingSpinner" class="loader"></div>
        </div>
    </div>

    <script>
        // Initialize user_id and stEmails from server-rendered data
        const user_id = "{{ user_id }}";
        const stEmails = {{ st_emails|tojson }};

        $(document).ready(function () {
            console.log("User ID (email):", user_id);
            console.log("ST Emails:", stEmails);

            // Display Suggestions (max 3)
            $("#emailInput").on("input", function () {
                const inputVal = $(this).val().toLowerCase();
                const suggestionsContainer = $("#suggestions");

                if (inputVal === "") {
                    // Hide suggestions if input is empty
                    suggestionsContainer.hide();
                    return;
                }

                const suggestions = stEmails
                    .filter(email => email.toLowerCase().includes(inputVal))
                    .slice(0, 3);

                suggestionsContainer.empty().toggle(suggestions.length > 0);

                suggestions.forEach(email => {
                    suggestionsContainer.append(`<div class="suggestion-item">${email}</div>`);
                });

                // Properly position the suggestions box
                const inputRect = this.getBoundingClientRect();
                suggestionsContainer.css({
                    top: inputRect.height + "px",
                    left: 0,
                    width: "100%"
                });
            });

            // Fill Input with Clicked Suggestion
            $(document).on("click", ".suggestion-item", function () {
                $("#emailInput").val($(this).text());
                $("#suggestions").hide();
            });

            // Handle Form Submission & Fetch OTP
            $("#otpForm").on("submit", function (e) {
                e.preventDefault();
                const email = $("#emailInput").val().trim();

                if (!email) return;

                // Show Loader and Reset Results
                $("#otpDate").text("---");
                $("#otpTime").text("---");
                $("#otpResult").text("---");
                $("#loadingSpinner").show();

                // AJAX Request to Fetch OTP
                $.ajax({
                    url: "/dashboard/st/fetch_otp",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ email: email, user_id: user_id }), // Use the captured user_id
                    success: function (data) {
                        const otpValue = data.otp || "Not found";
                        const datePart = data.date || "---";
                        const timePart = data.time || "---";

                        // Display Result and Hide Loader
                        $("#loadingSpinner").hide();
                        $("#otpDate").text(datePart);
                        $("#otpTime").text(timePart);
                        $("#otpResult").text(otpValue);
                    },
                    error: function () {
                        $("#loadingSpinner").hide();
                        $("#otpResult").text("Error fetching OTP");
                    }
                });
            });
        });
    </script>

</body>
</html>
