<!-- templates/add_id.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add ID</title>
    <script>
        function toggleSecretField() {
            const clientType = document.getElementById("client").value;
            const secretField = document.getElementById("secret-group");
            secretField.style.display = clientType === 'st' ? 'block' : 'none';
        }
    </script>
</head>
<body>
    <h2>Add New ID</h2>
    <form method="POST" action="/add_creds">
        <label for="client">Client:</label>
        <select name="client" id="client" onchange="toggleSecretField()">
            <option value="st">ST</option>
            <option value="pt">PT</option>
        </select><br><br>

        <label for="email">ID (Email):</label>
        <input type="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="text" name="password" required><br><br>

        <div id="secret-group">
            <label for="secret">OTP Secret:</label>
            <input type="text" name="secret"><br><br>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
